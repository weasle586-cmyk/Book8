set timeout=5
set default=0

insmod all_video
insmod gfxterm
terminal_output gfxterm

# Test image: boots straight to the command prompt (no desktop autostart, no
# static splash).  Add book8.splash=N to the kernel command line if a test
# needs to exercise splash playback; N is the number of 3-second holds.
menuentry "BOOK8 x86-64 (command shell)" {
    set gfxmode=1024x768x32,800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot2 /boot/book8.elf book8.autostart=0 book8.splash=0
    module2 /boot/book8-splash.b8s book8-splash
    module2 /boot/book8-hashes.bin book8-hashes
    boot
}

menuentry "BOOK8 Installer" {
    set gfxmode=1024x768x32,800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot2 /boot/book8.elf book8.splash=0
    module2 /boot/book8-splash.b8s book8-splash
    module2 /boot/book8-hashes.bin book8-hashes
    module2 /boot/book8-install.img book8-installer
    boot
}
