set timeout=5
set default=0

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "BOOK8 x86-64" {
    set gfxmode=1024x768x32,800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot2 /boot/book8.elf
    module2 /boot/book8-splash.b8s book8-splash
    module2 /boot/book8-hashes.bin book8-hashes
    module2 /boot/book8-apps.img book8-apps
    boot
}

menuentry "BOOK8 x86-64 (command shell)" {
    set gfxmode=1024x768x32,800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot2 /boot/book8.elf book8.autostart=0
    module2 /boot/book8-splash.b8s book8-splash
    module2 /boot/book8-hashes.bin book8-hashes
    module2 /boot/book8-apps.img book8-apps
    boot
}

menuentry "BOOK8 Installer" {
    set gfxmode=1024x768x32,800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot2 /boot/book8.elf
    module2 /boot/book8-splash.b8s book8-splash
    module2 /boot/book8-hashes.bin book8-hashes
    module2 /boot/book8-install.img book8-installer
    boot
}
