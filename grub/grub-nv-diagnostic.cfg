set timeout=5
set default=0

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "BOOK8 NVIDIA/PCIe diagnostics (nvinfo.txt on opted-in FAT boot volume)" {
    set gfxmode=1024x768x32,800x600x32,auto
    set gfxpayload=keep
    multiboot2 /boot/book8.elf book8.autostart=0 book8.splash=0
    module2 /boot/book8-splash.b8s book8-splash
    module2 /boot/book8-hashes.bin book8-hashes
    boot
}
